
# Campus IoT DNS Research Lab

# Do not read the system dnsmasq configuration
no-resolv

# Listen only on the Mininet DNS host address
listen-address=10.0.0.53
bind-interfaces

# Upstream DNS server
server=8.8.8.8

# Local campus research domain
domain=campus.test
local=/campus.test/

# Simulated campus services
address=/elearning.campus.test/10.0.0.100
address=/updates.campus.test/10.0.0.100
address=/cloud.campus.test/10.0.0.100
address=/services.campus.test/10.0.0.100

# Controlled DNS tunnelling research domain
address=/.tunnel.campus.test/10.0.0.100

# DNS query logging
log-queries
log-facility=/tmp/campus-dns.log

